[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mavzu"
version = "0.1.0"
description = "Uzbek news topic classification: TF-IDF baseline, fine-tuned TahrirchiBERT, ONNX serving, Latin/Cyrillic support"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "pyyaml>=6",
]

[project.optional-dependencies]
train = [
    "torch>=2.3",
    "transformers>=4.46",
    "datasets>=2.19",
    "accelerate>=0.30",
    "matplotlib>=3.8",
]
onnx = ["onnx>=1.16", "onnxruntime>=1.18", "transformers>=4.46"]
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.6"]
demo = ["gradio>=4.40"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
